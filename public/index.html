<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Register - SIH 2026 RBCET</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="Registration and participant management for the RBCET internal round of Smart India Hackathon 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Public+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f3efe7'/%3E%3Crect x='7' y='6' width='2' height='20' fill='%23b02a24'/%3E%3Crect x='12' y='9' width='14' height='2' rx='1' fill='%231b1713'/%3E%3Crect x='12' y='15' width='14' height='2' rx='1' fill='%2333409b'/%3E%3Crect x='12' y='21' width='9' height='2' rx='1' fill='%232c6b4b'/%3E%3C/svg%3E">
<script>
  // Applied before first paint, so a dark-theme reader never sees a light flash.
  try {
    const t = localStorage.getItem('sih-theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<div class="app">
  <header class="masthead">
    <div class="mast-row">
      <div class="brand">
        <span class="seal" aria-hidden="true">SIH<b>26</b></span>
        <span class="brand-text">
          <span class="brand-title">The Team Register</span>
          <span class="brand-sub">RBCET Internal Round <i>&middot;</i> Smart India Hackathon 2026</span>
        </span>
      </div>

      <div class="toolbar">
        <button class="btn" id="btn-import">Import</button>
        <button class="btn" id="btn-export">Export</button>
        <button class="btn" id="btn-reset">Empty</button>
        <span class="tool-sep"></span>
        <button class="btn accent" id="btn-build">Auto-build teams</button>
        <button class="btn accent" id="btn-confirm" hidden>Confirm proposals</button>
        <span class="tool-sep"></span>
        <button class="icon-btn" id="btn-theme" title="Switch between light and dark" aria-label="Switch between light and dark">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn ghost" id="btn-session" hidden>Sign in</button>
      </div>
    </div>
    <div class="mast-rule" aria-hidden="true"></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="balance" id="strip"></div>

  <div class="workspace">
    <main>
      <div class="section-head">
        <h2>Teams</h2>
        <span class="count" id="teams-count"></span>
        <span class="spacer"></span>
        <div class="seg" id="filters" role="group" aria-label="Filter teams">
          <button data-filter="all" aria-pressed="true">All</button>
          <button data-filter="bad" aria-pressed="false">Flagged</button>
          <button data-filter="ok" aria-pressed="false">Cleared</button>
        </div>
      </div>
      <div class="entries" id="teams"></div>
    </main>

    <aside class="rail">
      <section class="slip">
        <div class="slip-head"><h3>Rules of composition</h3><span class="meta">Director &amp; HOD</span></div>
        <div class="slip-body" id="rules"></div>
      </section>

      <section class="slip">
        <div class="slip-head"><h3>Capacity of the pool</h3></div>
        <div class="slip-body" id="cap"></div>
      </section>

      <section class="slip">
        <div class="slip-head">
          <h3>Unassigned pool</h3>
          <span class="meta" id="pool-n"></span>
          <button class="btn sm" id="btn-add">Add student</button>
        </div>
        <div id="pool"></div>
      </section>

      <section class="slip">
        <div class="slip-head"><h3>Data issues</h3><span class="meta" id="iss-n"></span></div>
        <div id="issues"></div>
      </section>
    </aside>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlg-t">Dialog</h3></div>
  <div class="dlg-body" id="dlg-b"></div>
  <div class="dlg-foot" id="dlg-f"></div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
